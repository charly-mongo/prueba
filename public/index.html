<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>George Burger - Menú Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">🍔 George Burger</h1>
                <button class="cart-btn" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-menu">
        <div class="container">
            <div class="nav-buttons">
                <button class="nav-btn active" data-category="hamburguesas">
                    <i class="fas fa-hamburger"></i>
                    <span>Hamburguesas</span>
                </button>
                <button class="nav-btn" data-category="hotdogs">
                    <i class="fas fa-hotdog"></i>
                    <span>Hot Dogs</span>
                </button>
                <button class="nav-btn" data-category="sincronizadas">
                    <i class="fas fa-bread-slice"></i>
                    <span>Sincronizadas</span>
                </button>
                <button class="nav-btn" data-category="tortas">
                    <i class="fas fa-sandwich"></i>
                    <span>Tortas y Burros</span>
                </button>
                <button class="nav-btn" data-category="bebidas">
                    <i class="fas fa-glass-water"></i>
                    <span>Bebidas</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Menu Items -->
            <div id="menuContainer" class="menu-grid">
                <!-- Los items del menú se cargarán dinámicamente con JavaScript -->
            </div>
        </div>
    </main>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛒 Mi Pedido</h2>
                <button class="close-btn" onclick="closeCart()">×</button>
            </div>
            <div class="modal-body">
                <div id="cartItems" class="cart-items"></div>
                <div class="cart-total">
                    <strong>Total:</strong>
                    <span id="cartTotal">$0</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCart()">Seguir Comprando</button>
                <button class="btn btn-primary" onclick="proceedToCheckout()">Proceder al Pedido</button>
            </div>
        </div>
    </div>

    <!-- Item Detail Modal -->
    <div class="modal" id="itemModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="itemTitle">Título del Producto</h2>
                <button class="close-btn" onclick="closeItemModal()">×</button>
            </div>
            <div class="modal-body">
                <p class="item-ingredients" id="itemIngredients"></p>
                <p class="item-price" id="itemPrice"></p>
                
                <div class="extras-section">
                    <h3>Ingredientes Extra</h3>
                    <div id="extraIngredients" class="extras-grid"></div>
                </div>
                
                <div class="vegetables-section">
                    <h3>Verduras (Incluidas)</h3>
                    <div id="vegetables" class="checkbox-group"></div>
                </div>
                
                <div class="condiments-section">
                    <h3>Aderezos (Incluidos)</h3>
                    <div id="condiments" class="checkbox-group"></div>
                </div>
                
                <div class="quantity-section">
                    <label for="quantity">Cantidad:</label>
                    <div class="quantity-controls">
                        <button onclick="decreaseQuantity()">-</button>
                        <input type="number" id="quantity" value="1" min="1" max="10">
                        <button onclick="increaseQuantity()">+</button>
                    </div>
                </div>
                
                <div class="special-instructions">
                    <label for="instructions">Instrucciones especiales:</label>
                    <textarea id="instructions" rows="3" placeholder="Ej: Sin cebolla, extra picante, etc."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeItemModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="addToCart()">
                    <i class="fas fa-cart-plus"></i> Agregar al Carrito
                </button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📝 Datos del Pedido</h2>
                <button class="close-btn" onclick="closeCheckout()">×</button>
            </div>
            <div class="modal-body">
                <form id="checkoutForm">
                    <div class="delivery-type">
                        <h3>Tipo de Entrega</h3>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="deliveryType" value="pickup" checked onchange="toggleDeliveryFields()">
                                <span>🏪 Recoger en Tienda</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="deliveryType" value="delivery" onchange="toggleDeliveryFields()">
                                <span>🏍️ Entrega a Domicilio</span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="customerName">Nombre: *</label>
                        <input type="text" id="customerName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="customerPhone">Teléfono:</label>
                        <input type="tel" id="customerPhone" placeholder="10 dígitos">
                    </div>
                    
                    <div id="deliveryFields" style="display: none;">
                        <div class="form-group">
                            <label for="address">Dirección: *</label>
                            <input type="text" id="address" placeholder="Calle y número">
                        </div>
                        
                        <div class="form-group">
                            <label for="betweenStreets">Entre calles:</label>
                            <input type="text" id="betweenStreets" placeholder="Ej: Entre 5 de Mayo y Juárez">
                        </div>
                        
                        <div class="form-group">
                            <label for="neighborhood">Colonia: *</label>
                            <input type="text" id="neighborhood">
                        </div>
                        
                        <div class="form-group">
                            <label for="zone">Zona (para costo de envío): *</label>
                            <select id="zone">
                                <option value="">Seleccione una zona</option>
                                <option value="centro">Centro - $20</option>
                                <option value="norte">Zona Norte - $30</option>
                                <option value="sur">Zona Sur - $35</option>
                                <option value="oriente">Zona Oriente - $40</option>
                                <option value="poniente">Zona Poniente - $40</option>
                            </select>
                        </div>
                        
                        <div class="delivery-cost">
                            <strong>Costo de envío:</strong>
                            <span id="deliveryCost">$0</span>
                        </div>
                    </div>
                    
                    <div class="order-summary">
                        <h3>Resumen del Pedido</h3>
                        <div id="orderSummary"></div>
                        <div class="total-section">
                            <div class="subtotal">
                                <strong>Subtotal:</strong>
                                <span id="subtotal">$0</span>
                            </div>
                            <div class="delivery-fee" id="deliveryFeeRow" style="display: none;">
                                <strong>Envío:</strong>
                                <span id="deliveryFee">$0</span>
                            </div>
                            <div class="grand-total">
                                <strong>Total a Pagar:</strong>
                                <span id="grandTotal">$0</span>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCheckout()">Volver</button>
                <button class="btn btn-whatsapp" onclick="sendToWhatsApp()">
                    <i class="fab fa-whatsapp"></i> Enviar por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script src="js/menu-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
